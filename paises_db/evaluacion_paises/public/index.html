<html>

<h1>Administración de Países</h1>

<h2>Listar Países</h2>

<select id="limite">

<option value="10">10</option>

</select>

</button>

</button>

<h2>Agregar País</h2>

<input
id="nombre"
placeholder="Nombre">

id="continente"
placeholder="Continente">

id="poblacion"

id="pib2019"

<h2>Eliminar País</h2>

<input
id="nombreEliminar"

<button onclick="eliminarPais()">
Eliminar
</button>
